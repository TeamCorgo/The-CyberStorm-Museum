<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corgo: BIN Converter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="https://www.corgo.org/" class="logo"><img src="images/Dark_Logo_Circle.svg" alt="Corgo"></a>
  <a href="https://www.corgo.org/" class="brand">Corgo</a>
  <div class="divider"></div>
  <div class="tool-title">BIN Reader</div>
</header>

<div id="dropOverlay">
  <div class="overlay-box">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v12"/>
      <polyline points="7,10 12,15 17,10"/>
      <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <p>Drop to load</p>
    <small>.bin files — anywhere on this page</small>
  </div>
</div>

<div class="main"><div class="wrap">

<div class="panel actions">
  <label class="btn browse-btn" id="dropZone">
    <input type="file" id="fileInput" accept=".bin" multiple>
    Browse .bin files…
  </label>
  <span class="stats" id="headerHint">or drop files anywhere on the page</span>
  <button class="btn primary" id="exportBtn" disabled>Export CSV</button>
</div>

<div id="tabBar" class="files-tabs hidden"></div>

<div class="content" id="content">
  <div class="empty-state is-dropzone panel" id="emptyState">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14,2 14,8 20,8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10,9 9,9 8,9"/>
    </svg>
    <p>No file loaded</p>
    <small>Drop one or more <code>.bin</code> text resource files anywhere on this page, or <kbd>click</kbd> to browse</small>
  </div>
</div>

</div></div>

<script src="js/bin_converter.js"></script>
</body>
</html>
