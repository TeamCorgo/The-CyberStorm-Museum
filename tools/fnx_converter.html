<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corgo: FNX Converter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="https://www.corgo.org/" class="logo"><img src="images/Dark_Logo_Circle.svg" alt="Corgo"></a>
  <a href="https://www.corgo.org/" class="brand">Corgo</a>
  <div class="divider"></div>
  <div class="tool-title">FNX Font Reader</div>
</header>

<div id="dropOverlay">
  <div class="overlay-box">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v12"/>
      <polyline points="7,10 12,15 17,10"/>
      <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <p>Drop to load</p>
    <small>.fnx files — anywhere on this page</small>
  </div>
</div>

<div class="workspace">

  <!-- LEFT: file info -->
  <div class="left" id="left">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="*">
      <div class="drop-label">
        <strong>Drop a .fnx file here</strong>
        or click to browse<br>
        <span class="drop-sub">font0.fnx · font1.fnx · font3.fnx …</span>
      </div>
    </div>
    <div id="infoPanel"></div>
  </div>

  <!-- RIGHT: glyph grid -->
  <div class="right">
    <div class="right-toolbar" id="toolbar">
      <label>
        Scale
        <input type="range" id="scaleSlider" min="1" max="12" value="4">
        <span class="scale-val" id="scaleVal">4×</span>
      </label>
      <label>
        BG
        <select id="bgSelect">
          <option value="#161b27">Dark</option>
          <option value="#ffffff">White</option>
          <option value="#888888">Mid grey</option>
          <option value="#000000">Black</option>
        </select>
      </label>
      <label>
        Shading
        <select id="shadingSelect">
          <option value="shaded">Shaded (as-is)</option>
          <option value="brightest">Brightest only</option>
        </select>
      </label>
      <label>
        Ink
        <select id="inkSelect">
          <option value="#00ff00" selected>Cyberstorm</option>
          <option value="#00d4ff">Cyan</option>
          <option value="#ffffff">White</option>
          <option value="#4ade80">Green</option>
          <option value="#f59e0b">Amber</option>
          <option value="#f87171">Red</option>
        </select>
      </label>
      <label id="glyphCount" class="glyph-count"></label>
      <button id="exportBitmapBtn">Export .png</button>
      <button id="exportTtfBtn" class="primary">Export .ttf</button>
    </div>
    <div id="glyphArea" class="glyph-scroll">
      <div class="empty-state fill">
        <p>Load a <code>.fnx</code> file to inspect its glyphs and structure</p>
        <p class="empty-sub">Supports raw blobs and <code>PKX:</code> compressed containers. RLE and LZSS decompression built-in.</p>
      </div>
    </div>
  </div>

</div>

<script src="js/fnx_converter.js"></script>
</body>
</html>
