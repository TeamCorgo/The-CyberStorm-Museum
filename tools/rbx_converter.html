<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corgo: RBX Converter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a href="https://www.corgo.org/" class="logo"><img src="images/Dark_Logo_Circle.svg" alt="Corgo"></a>
  <a href="https://www.corgo.org/" class="brand">Corgo</a>
  <div class="divider"></div>
  <div class="tool-title">RBX Archive Extractor</div>
</header>

<div class="main"><div class="wrap">
  <div class="panel">
    <p class="section-label">About</p>
    <p>
      Unpacks the resource archive format used by <code>cstorm.exe</code> (name-table + offset entries,
      each pointing to a 4-byte length prefix followed by raw data).
    </p>
  </div>

  <div class="panel rbx-panel">
    <div id="drop" class="drop-zone" tabindex="0" role="button" aria-label="Choose an .RBX file">
      <div class="ttl">Drop a .RBX file here, or click to browse</div>
      <div class="hint">e.g. CYBDATA1.RBX — CYBDATA4.RBX</div>
      <input id="file" type="file" accept=".rbx,*/*">
    </div>

    <div id="filebar" class="filebar" hidden>
      <span><b id="fname"></b> — <span id="fsize"></span></span>
      <button class="linklike" id="clearBtn">choose a different file</button>
    </div>

    <div id="status" class="status-line" hidden><span id="statusDot" class="dot"></span><span id="statusText"></span></div>

    <div id="metarow" class="metarow" hidden></div>

    <div id="actionsRow" class="actions" hidden>
      <button id="extractBtn" class="primary">Extract to .zip</button>
      <div class="progress" id="progressWrap" hidden><div id="progressBar"></div></div>
    </div>

    <div id="tableSection" hidden>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Name</th><th class="num-col">Offset</th><th class="num-col">Size</th></tr></thead>
          <tbody id="entriesBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div></div>

<script src="js/rbx_converter.js"></script>
</body>
</html>
