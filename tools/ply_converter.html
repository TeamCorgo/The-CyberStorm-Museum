<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corgo: PLY Converter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="https://www.corgo.org/" class="logo"><img src="images/Dark_Logo_Circle.svg" alt="Corgo"></a>
  <a href="https://www.corgo.org/" class="brand">Corgo</a>
  <div class="divider"></div>
  <div class="tool-title">PLY Region Viewer</div>
</header>

<div class="main" id="ply-shell">

<div id="drop-zone" class="drop-zone dz-full">
  <input type="file" id="file-input" accept=".ply">
  <div class="label">Drop a <strong>.ply</strong> file here</div>
  <div class="sub">or click to browse — binary polygon region format (0x84 bytes/record)</div>
</div>

<div class="wrap">

<p class="section-label">Renders the custom polygon hit-region binary format (.ply)</p>

<div id="error-msg" class="errbox"></div>

<div id="ply-main">
  <div id="stats" class="panel"></div>
  <div id="canvas-wrap" class="panel"><canvas id="canvas"></canvas></div>
  <div id="controls" class="panel">
    <label class="toggle"><input type="checkbox" id="chk-fill" checked> Fill polygons</label>
    <label class="toggle"><input type="checkbox" id="chk-outline" checked> Outlines</label>
    <label class="toggle"><input type="checkbox" id="chk-verts"> Vertices</label>
    <label class="toggle"><input type="checkbox" id="chk-labels" checked> Labels</label>
    <button id="btn-export" class="btn primary">Export PNG</button>
  </div>
  <div id="legend" class="panel">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Color</th>
          <th>Vertices</th>
          <th>Bounding box</th>
        </tr>
      </thead>
      <tbody id="legend-body"></tbody>
    </table>
  </div>
  <button id="reset" class="btn">Load a different file</button>
</div>

</div></div>

<script src="js/ply_converter.js"></script>
</body>
</html>
