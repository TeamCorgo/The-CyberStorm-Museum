<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corgo: BOX Converter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="viewport-lock">

<header class="site-header">
  <a href="https://www.corgo.org/" class="logo"><img src="images/Dark_Logo_Circle.svg" alt="Corgo"></a>
  <a href="https://www.corgo.org/" class="brand">Corgo</a>
  <div class="divider"></div>
  <div class="tool-title">.BOX Viewer</div>
</header>

<div class="toolbar-row">
  <h1 id="h-title">.BOX Viewer</h1>
  <span class="badge accent hidden" id="b-widgets"></span>
  <span class="badge accent hidden" id="b-canvas">640 × 480</span>
  <span class="badge accent hidden" id="b-size"></span>
  <button id="export-btn" onclick="exportPNG()" class="hidden">Export PNG</button>
  <div class="toggle-row hidden" id="toggle-row">
    <label><input type="checkbox" id="tog-abs" checked onchange="render()"> absolute coords</label>
    <label><input type="checkbox" id="tog-idx" checked onchange="render()"> widget index</label>
    <label><input type="checkbox" id="tog-grid" checked onchange="render()"> grid</label>
    <label><input type="checkbox" id="tog-origin" checked onchange="render()"> screen origin</label>
  </div>
  <button class="upload-btn" onclick="triggerUpload()">Open .BOX file</button>
</div>

<input type="file" id="file-input" accept=".box,.BOX" class="hidden" onchange="handleFile(this.files[0])">

<div class="layout" id="main-layout">
  <!-- Drop zone (default state) -->
  <div class="drop-zone" id="drop-zone" onclick="triggerUpload()">
    <div class="dz-title">Drop a .BOX file here</div>
    <div class="dz-sub">or click to browse</div>
    <button class="dz-btn btn" onclick="event.stopPropagation(); triggerUpload()">Choose file</button>
  </div>

  <!-- Canvas (hidden until file loaded) -->
  <div class="canvas-wrap hidden" id="canvas-wrap">
    <div class="canvas-title" id="canvas-title">640 × 480 game canvas — click a widget to inspect</div>
    <canvas id="cv" width="640" height="480"></canvas>
  </div>

  <!-- Sidebar (hidden until file loaded) -->
  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">Widgets</div>
    <div class="widget-list" id="wlist"></div>
    <div class="detail-panel hidden" id="detail">
      <h3>Selected widget</h3>
      <div id="detail-rows"></div>
    </div>
    <div class="screen-info" id="screen-info"></div>
  </div>
</div>

<script src="js/box_converter.js"></script>
</body>
</html>
